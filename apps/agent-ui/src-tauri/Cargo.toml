[package]
name = "claw-agent-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = ["gui"]
gui = ["tauri", "tauri-plugin-dialog", "tauri-plugin-shell", "tauri-build"]

[lib]
name = "claw_agent_ui"
path = "src/lib.rs"

[[bin]]
name = "claw-agent-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
base64 = "0.22"
chrono = "0.4"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-shell = { version = "2", optional = true }
once_cell = "1"
walkdir = "2"
fs_extra = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "signal"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
async-stream = "0.3"
futures = "0.3"
reqwest = { version = "0.13.4", features = ["json"] }

[dev-dependencies]
tempfile = "3"
tower = "0.5"
http = "1"

[lints.rust]
unsafe_code = "forbid"
